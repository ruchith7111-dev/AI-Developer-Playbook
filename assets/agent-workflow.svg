<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="t d">
<title id="t">Supervised coding agent workflow</title><desc id="d">Developer defines task and boundaries, agent inspects context and plans, agent edits and tests, developer reviews and approves.</desc>
<rect width="1000" height="420" rx="24" fill="#0b1220"/><text x="42" y="52" fill="#f8fafc" font-family="Arial" font-size="23" font-weight="700">A supervised coding-agent workflow</text>
<g font-family="Arial" text-anchor="middle">
<rect x="55" y="100" width="250" height="78" rx="13" fill="#172554" stroke="#60a5fa"/><text x="180" y="130" fill="#bfdbfe" font-size="13">DEVELOPER</text><text x="180" y="153" fill="#fff" font-size="17" font-weight="700">Define task + boundaries</text>
<rect x="375" y="100" width="250" height="78" rx="13" fill="#312e81" stroke="#818cf8"/><text x="500" y="130" fill="#c7d2fe" font-size="13">AGENT</text><text x="500" y="153" fill="#fff" font-size="17" font-weight="700">Inspect project context</text>
<rect x="695" y="100" width="250" height="78" rx="13" fill="#3b0764" stroke="#c084fc"/><text x="820" y="130" fill="#e9d5ff" font-size="13">AGENT</text><text x="820" y="153" fill="#fff" font-size="17" font-weight="700">Propose a plan</text>
<rect x="695" y="260" width="250" height="78" rx="13" fill="#164e63" stroke="#22d3ee"/><text x="820" y="290" fill="#a5f3fc" font-size="13">AGENT</text><text x="820" y="313" fill="#fff" font-size="17" font-weight="700">Edit + run checks</text>
<rect x="375" y="260" width="250" height="78" rx="13" fill="#14532d" stroke="#4ade80"/><text x="500" y="290" fill="#bbf7d0" font-size="13">DEVELOPER</text><text x="500" y="313" fill="#fff" font-size="17" font-weight="700">Review diff + evidence</text>
<rect x="55" y="260" width="250" height="78" rx="13" fill="#713f12" stroke="#fbbf24"/><text x="180" y="290" fill="#fde68a" font-size="13">DEVELOPER</text><text x="180" y="313" fill="#fff" font-size="17" font-weight="700">Approve, revise, or revert</text>
</g>
<g stroke="#94a3b8" stroke-width="2" fill="none"><path d="M305 139 H365"/><path d="M625 139 H685"/><path d="M820 178 V250"/><path d="M695 299 H635"/><path d="M375 299 H315"/></g>
<text x="500" y="385" fill="#cbd5e1" text-anchor="middle" font-family="Arial" font-size="14">Grant only the permissions the current task needs.</text>
</svg>